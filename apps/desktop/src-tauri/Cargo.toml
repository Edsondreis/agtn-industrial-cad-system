[package]
name = "agtn-cad"
version = "0.3.0"
description = "AGTN Industrial CAD"
authors = ["AGTN"]
edition = "2021"
publish = false

[lib]
name = "agtn_cad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
