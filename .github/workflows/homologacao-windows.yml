# FASE 4 · ETAPA 4 — homologação no Windows do GitHub (WebView2 do runner), SÓ MANUAL e SEM PUBLICAR NADA.
# Roda W1 (build e testes) e o validar_instalado.ps1 no Windows PowerShell 5.1 (W2, W4, W5, W7 automático, P2 do
# runner — NÃO é o hardware da AGTN). Resultado nos artefatos. Não cria tag, Release nem mexe na main.
# Observação: em 12/11/2026 as execuções do GitHub Actions desta conta falhavam em 4 s por cobrança.
name: Homologação Windows (manual)

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "repetições do teste de fumaça (estabilidade)"
        default: "2"

permissions:
  contents: read

jobs:
  homologacao:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: cargo test (DWG reais)
        working-directory: apps/desktop/src-tauri
        env:
          AGTN_DWG_SAMPLES: ${{ github.workspace }}/tests/dwg
        run: cargo test --release
      - name: tauri build (NSIS, sem assinatura)
        run: npm run tauri -- build --bundles nsis
      - name: Validar o instalado (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/validar_instalado.ps1 -Instalador $setup.FullName -Out "$env:RUNNER_TEMP\homologacao" -Repeticoes ${{ github.event.inputs.repeticoes }}
          exit $LASTEXITCODE
      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-windows
          retention-days: 14
          path: |
            ${{ runner.temp }}/homologacao/**
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
