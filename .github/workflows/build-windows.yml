name: CI e build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (geometria, DXF, chapas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ezdxf
      - run: npm run validate:dxf

  windows:
    name: Build Windows (exe + instaladores)
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Testes do shell nativo
        working-directory: apps/desktop/src-tauri
        run: cargo test --release
      - name: Build Tauri
        run: npm run tauri -- build
      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: AGTN-CAD-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/agtn-cad.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
