name: CI e build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (geometria, DXF, chapas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ezdxf
      - run: npm run validate:dxf

  windows:
    name: Build Windows (exe + instaladores)
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Testes do shell nativo (inclui DWG reais do AutoCAD)
        working-directory: apps/desktop/src-tauri
        env:
          AGTN_DWG_SAMPLES: ${{ github.workspace }}/tests/dwg
        run: cargo test --release
      - name: Build Tauri (assina se houver certificado nos secrets)
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ secrets.SIGN_COMMAND }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
          # credenciais de fornecedores de assinatura em nuvem usadas dentro do SIGN_COMMAND
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          if ($env:SIGN_COMMAND -or $env:WINDOWS_CERT_PFX_BASE64) {
            $script = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/windows/sign.ps1"
            $cfg = @{ bundle = @{ windows = @{ signCommand = @{ cmd = "pwsh"; args = @("-NoProfile", "-File", $script, "%1") } } } }
            $cfgPath = Join-Path $env:RUNNER_TEMP "assinatura.conf.json"
            $cfg | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $cfgPath
            Write-Host "Assinatura de código: ATIVADA"
            "SIGNED=true" >> $env:GITHUB_ENV
            npm run tauri -- build --config $cfgPath
          } else {
            Write-Host "::notice::Assinatura de código desativada (sem certificado nos secrets) — veja docs/ASSINATURA.md"
            npm run tauri -- build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Conferir assinatura
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $files = @(Get-Item apps/desktop/src-tauri/target/release/agtn-cad.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          foreach ($f in $files) { & $signtool.FullName verify /pa /v $f.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        # cota de armazenamento de artefatos cheia não pode impedir a Release (os instaladores vão para a Release)
        continue-on-error: true
        with:
          name: AGTN-CAD-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/agtn-cad.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Verificar se a versão já foi publicada
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Versão $tag — já publicada: $exists"
      - name: Somas SHA-256
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $files = @(Get-Item apps/desktop/src-tauri/target/release/agtn-cad.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publicar Release (cria a tag da versão)
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AGTN Industrial CAD ${{ steps.rel.outputs.tag }}
          body_path: docs/release-notes/${{ steps.rel.outputs.tag }}.md
          make_latest: true
          files: |
            apps/desktop/src-tauri/target/release/agtn-cad.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
