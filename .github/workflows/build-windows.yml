name: CI e build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (geometria, DXF, chapas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ezdxf
      - run: npm run validate:dxf

  windows:
    name: Build Windows (exe + instaladores)
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Testes do shell nativo
        working-directory: apps/desktop/src-tauri
        run: cargo test --release
      - name: Build Tauri
        run: npm run tauri -- build
      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: AGTN-CAD-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/agtn-cad.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Somas SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @(Get-Item apps/desktop/src-tauri/target/release/agtn-cad.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe) + (Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AGTN Industrial CAD ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: |
            apps/desktop/src-tauri/target/release/agtn-cad.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
